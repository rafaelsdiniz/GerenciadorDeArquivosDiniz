# =========================
# DATASOURCE
# =========================
quarkus.datasource.db-kind=postgresql
# credenciais por variável de ambiente (dev: arquivo .env local; produção: painel do Render)
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=${DB_URL}

# Neon hiberna em ~5min; primeira conexao pode demorar para acordar.
quarkus.datasource.jdbc.acquisition-timeout=60S
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.additional-jdbc-properties.loginTimeout=60
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=60
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=60

# =========================
# HIBERNATE ORM
# =========================
# dev/test: recria o banco e carrega os dados de exemplo a cada início
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
# produção: preserva os dados. Na 1ª publicação use DB_GENERATION=drop-and-create e DB_SEED=import.sql
# para criar as tabelas com os dados de demonstração; depois volte para update / no-file.
%prod.quarkus.hibernate-orm.database.generation=${DB_GENERATION:update}
%prod.quarkus.hibernate-orm.sql-load-script=${DB_SEED:no-file}
%prod.quarkus.hibernate-orm.log.sql=false

# =========================
# HTTP
# =========================
quarkus.http.port=${PORT:8080}

# =========================
# SWAGGER / OPENAPI
# =========================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# =========================
# JWT
# =========================
mp.jwt.verify.issuer=diniz-contabilidade
# chaves: em produção o Docker gera um par novo (fora do git) e aponta estas variáveis para ele
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:classpath:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:classpath:privateKey.pem}

# =========================
# MAILER (DEV: usa MockMailer; em prod configurar SMTP real)
# =========================
quarkus.mailer.from=noreply@diniz-contabilidade.local
quarkus.mailer.mock=true
# Para usar SMTP real (ex: gmail), comente a linha acima e configure:
# quarkus.mailer.host=smtp.gmail.com
# quarkus.mailer.port=587
# quarkus.mailer.start-tls=REQUIRED
# quarkus.mailer.username=seu-email@gmail.com
# quarkus.mailer.password=sua-senha-de-app

# =========================
# SCHEDULER
# =========================
# Jobs internos rodam no horário do servidor

# =========================
# NOTIFICACOES
# =========================
notificacao.dias-aviso=30,15,7,3,1

# =========================
# CORS (Angular)
# =========================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,content-disposition
quarkus.http.cors.access-control-max-age=24H
# =========================
# INTEGRACAO DEC (Domicilio Eletronico do Contribuinte / DEC Monitor) - somente leitura
# Defina as variaveis de ambiente DEC_URL e DEC_TOKEN (= INTEGRACAO_TOKEN no DEC).
# Sem elas a integracao fica desligada.
# =========================
dec.url=${DEC_URL:}
dec.token=${DEC_TOKEN:}
dec.dias=365
# modo demonstração: mostra comunicações fictícias (versão pública para a banca, sem dados reais — LGPD)
dec.demo=${DEC_DEMO:false}

# =========================
# TESTES AUTOMATIZADOS (perfil %test - ./mvnw test)
# Banco H2 em memória: os testes NUNCA usam o banco real (Neon) nem o DEC real,
# mesmo que o arquivo .env local defina DB_URL / DEC_URL.
# A integração com o DEC é desligada nos testes em src/test/resources/META-INF/microprofile-config.properties
# =========================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.initial-size=1
%test.quarkus.datasource.jdbc.min-size=1
%test.quarkus.datasource.jdbc.acquisition-timeout=5S
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=no-file
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.http.test-port=0
%test.dec.demo=false
