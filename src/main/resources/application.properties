# =========================
# DATASOURCE
# =========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=neondb_owner
quarkus.datasource.password=npg_wWEMImy38Snk
quarkus.datasource.jdbc.url=jdbc:postgresql://ep-dark-hall-ac8nwqkc-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require

# Neon hiberna em ~5min; primeira conexao pode demorar para acordar.
quarkus.datasource.jdbc.acquisition-timeout=60S
quarkus.datasource.jdbc.initial-size=0
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.additional-jdbc-properties.loginTimeout=60
quarkus.datasource.jdbc.additional-jdbc-properties.connectTimeout=60
quarkus.datasource.jdbc.additional-jdbc-properties.socketTimeout=60

# =========================
# HIBERNATE ORM
# =========================
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# =========================
# HTTP
# =========================
quarkus.http.port=8080

# =========================
# SWAGGER / OPENAPI
# =========================
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# =========================
# JWT
# =========================
mp.jwt.verify.issuer=diniz-contabilidade
mp.jwt.verify.publickey.location=classpath:publicKey.pem
smallrye.jwt.sign.key.location=classpath:privateKey.pem

# =========================
# MAILER (DEV: usa MockMailer; em prod configurar SMTP real)
# =========================
quarkus.mailer.from=noreply@diniz-contabilidade.local
quarkus.mailer.mock=true
# Para usar SMTP real (ex: gmail), comente a linha acima e configure:
# quarkus.mailer.host=smtp.gmail.com
# quarkus.mailer.port=587
# quarkus.mailer.start-tls=REQUIRED
# quarkus.mailer.username=seu-email@gmail.com
# quarkus.mailer.password=sua-senha-de-app

# =========================
# SCHEDULER
# =========================
# Jobs internos rodam no horário do servidor

# =========================
# NOTIFICACOES
# =========================
notificacao.dias-aviso=30,15,7,3,1

# =========================
# CORS (Angular)
# =========================
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=location,content-disposition
quarkus.http.cors.access-control-max-age=24H