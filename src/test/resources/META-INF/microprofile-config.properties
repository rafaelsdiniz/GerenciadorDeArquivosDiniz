# Configuração exclusiva dos testes automatizados (só existe no classpath de teste).
#
# As variáveis de ambiente / arquivo .env (DEC_URL, DEC_TOKEN, DEC_DEMO) viram
# diretamente as propriedades dec.url / dec.token / dec.demo, com prioridade (ordinal)
# 300/295 - maior que a do application.properties (250). Por isso um "%test.dec.url="
# lá não bastaria: os testes acabariam chamando o DEC real. Esta fonte tem ordinal 350
# e garante a integração DESLIGADA nos testes. Os testes do DEC usam um servidor falso
# (FakeDecServer), cuja configuração tem prioridade ainda maior.
config_ordinal=350
dec.url=
dec.token=
dec.demo=false
